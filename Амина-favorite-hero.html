Түсінікті! Барлығын бір ғана **index.html** файлының ішіне (CSS стилін `<style>` тегінің ішіне қосып) жасап шығардым.

Төмендегі кодты көшіріп, `index.html` файлына сақтасаңыз болғаны, сайт бірден жұмыс істейді:

```html
<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менің сүйікті кейіпкерім</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f4068, #162447);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: row;
            max-width: 800px;
            width: 90%;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .character-img img {
            width: 300px;
            height: 100%;
            object-fit: cover;
        }

        .character-info {
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .character-info h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #00adb5;
        }

        .anime-name {
            font-size: 1.1rem;
            color: #eeeeee;
            margin-bottom: 20px;
            font-weight: 400;
        }

        .description {
            font-size: 1rem;
            line-height: 1.6;
            color: #d1d1d1;
            margin-bottom: 25px;
        }

        .traits {
            display: flex;
            gap: 10px;
        }

        .tag {
            background-color: #00adb5;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .card {
                flex-direction: column;
                max-width: 400px;
            }
            .character-img img {
                width: 100%;
                height: 250px;
            }
            .character-info {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Сурет сілтемесі -->
        <div class="character-img">
            <img src="https://via.placeholder.com/300x350" alt="Кейіпкер суреті">
        </div>

        <!-- Ақпарат -->
        <div class="character-info">
            <h1>Кейіпкердің Аты</h1>
            <h3 class="anime-name">Аниме / Сериал атауы</h3>
            <p class="description">
                Бұл жерде кейіпкердің ерекшеліктері мен сізге несімен ұнайтыны туралы қысқаша мәлімет жаза аласыз.
            </p>
            
            <div class="traits">
                <span class="tag">Батыр</span>
                <span class="tag">Ақылды</span>
                <span class="tag">Мейірімді</span>
            </div>
        </div>
    </div>

</body>
</html>

```
